# Gradle settings. Loom decompiles Minecraft for genSources, which needs some extra memory.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties
# Check these on https://fabricmc.net/develop (or https://meta.fabricmc.net/v2/versions)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod properties
version=1.0.0
group=com.risingsettlements

# Dependencies
fabric_api_version=0.165.0+26.3
